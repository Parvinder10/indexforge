<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndexForge — High-Performance Full-Text Search Engine</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 and Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
    mark { background-color: rgba(245, 158, 11, 0.22); color: #fde68a; padding: 0.05rem 0.25rem; border-radius: 0.25rem; font-weight: 600; border: 1px solid rgba(245, 158, 11, 0.4); }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const DOC_TYPES = [
      { id: 'all', label: 'All Documents' },
      { id: 'tender', label: 'Public Tenders' },
      { id: 'notice', label: 'Gov Notices' },
      { id: 'policy', label: 'Policies' },
      { id: 'regulation', label: 'Regulations' },
      { id: 'tech_doc', label: 'Technical Docs' },
    ];

    const TYPE_COLORS = {
      tender: { bg: 'bg-emerald-500/10', text: 'text-emerald-300', border: 'border-emerald-500/30' },
      notice: { bg: 'bg-blue-500/10', text: 'text-blue-300', border: 'border-blue-500/30' },
      policy: { bg: 'bg-purple-500/10', text: 'text-purple-300', border: 'border-purple-500/30' },
      regulation: { bg: 'bg-amber-500/10', text: 'text-amber-300', border: 'border-amber-500/30' },
      tech_doc: { bg: 'bg-cyan-500/10', text: 'text-cyan-300', border: 'border-cyan-500/30' },
    };

    function App() {
      const [query, setQuery] = useState('public tender');
      const [algorithm, setAlgorithm] = useState('bm25');
      const [k1, setK1] = useState(1.2);
      const [b, setB] = useState(0.75);
      const [selectedType, setSelectedType] = useState('all');
      const [isLinear, setIsLinear] = useState(false);

      const [hits, setHits] = useState([]);
      const [totalHits, setTotalHits] = useState(0);
      const [latencyMs, setLatencyMs] = useState(null);
      const [fromCache, setFromCache] = useState(false);
      const [loading, setLoading] = useState(false);

      const [selectedDoc, setSelectedDoc] = useState(null);
      const [stats, setStats] = useState(null);
      const [showStatsModal, setShowStatsModal] = useState(false);
      const [showIngestionModal, setShowIngestionModal] = useState(false);
      const [showBenchmarkModal, setShowBenchmarkModal] = useState(false);
      const [showSyntax, setShowSyntax] = useState(false);
      const [showTuning, setShowTuning] = useState(false);

      const fetchStats = async () => {
        try {
          const res = await fetch('/api/stats');
          const data = await res.json();
          setStats(data);
        } catch (e) {
          console.error(e);
        }
      };

      const handleSearch = async (overrideQ) => {
        const q = overrideQ !== undefined ? overrideQ : query;
        if (!q.trim()) {
          setHits([]);
          setTotalHits(0);
          setLatencyMs(null);
          return;
        }

        setLoading(true);
        try {
          if (isLinear) {
            const res = await fetch(`/api/search/linear?q=${encodeURIComponent(q)}&limit=20`);
            const data = await res.json();
            setHits(data.hits || []);
            setTotalHits(data.total_hits || 0);
            setLatencyMs(data.engine_latency_ms);
            setFromCache(false);
          } else {
            const url = `/api/search?q=${encodeURIComponent(q)}&algo=${algorithm}&k1=${k1}&b=${b}&doc_type=${selectedType}&limit=20`;
            const res = await fetch(url);
            const data = await res.json();
            setHits(data.hits || []);
            setTotalHits(data.total_hits || 0);
            setLatencyMs(data.engine_latency_ms);
            setFromCache(data.from_cache);
          }
        } catch (err) {
          console.error('Search failed:', err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchStats();
        handleSearch();
      }, []);

      useEffect(() => {
        handleSearch();
      }, [algorithm, k1, b, selectedType, isLinear]);

      const openDoc = async (id) => {
        try {
          const res = await fetch(`/api/documents/${id}`);
          const data = await res.json();
          setSelectedDoc(data);
        } catch (e) {
          console.error(e);
        }
      };

      const deleteDoc = async (id) => {
        if (!confirm(`Delete Document #${id}?`)) return;
        try {
          await fetch(`/api/documents/${id}`, { method: 'DELETE' });
          setSelectedDoc(null);
          fetchStats();
          handleSearch();
        } catch (e) {
          alert(`Error: ${e}`);
        }
      };

      const maxScore = Math.max(...hits.map(h => h.score), 1.0);

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          {/* Top Navigation Bar */}
          <header className="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80 px-4 sm:px-8 py-3.5">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-blue-500/20 font-bold text-white text-lg">
                  ⚡
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="font-extrabold text-lg tracking-tight text-white">IndexForge</h1>
                    <span className="px-2 py-0.5 rounded text-[10px] font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/30">
                      C++20 Core
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-400 hidden sm:block">
                    High-Performance Inverted Index & Ranking Engine
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2 text-xs font-medium">
                <button
                  onClick={() => setShowBenchmarkModal(true)}
                  className="px-3.5 py-2 rounded-xl bg-purple-600/10 hover:bg-purple-600/20 text-purple-300 border border-purple-500/30 transition-all flex items-center gap-1.5 shadow-sm"
                >
                  ⚡ Benchmarks
                </button>
                <button
                  onClick={() => setShowStatsModal(true)}
                  className="px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-800 transition-all flex items-center gap-1.5 shadow-sm"
                >
                  📊 Stats ({stats?.active_documents || 0})
                </button>
                <button
                  onClick={() => setShowIngestionModal(true)}
                  className="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white transition-all shadow-md shadow-blue-600/20 flex items-center gap-1.5"
                >
                  + Ingest
                </button>
              </div>
            </div>
          </header>

          {/* Main Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-8 py-8 space-y-6">
            {/* Search Bar Form */}
            <div className="w-full max-w-5xl mx-auto space-y-4">
              <form onSubmit={(e) => { e.preventDefault(); handleSearch(); }} className="relative flex items-center">
                <div className="relative flex-1">
                  <input
                    type="text"
                    value={query}
                    onChange={(e) => setQuery(e.target.value)}
                    placeholder='Search documents (e.g. "public tender", federal AND cybersecurity, grant OR policy)...'
                    className="w-full pl-12 pr-28 py-3.5 bg-slate-900 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 text-base shadow-lg"
                  />
                  <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg">🔍</span>
                  {query && (
                    <button
                      type="button"
                      onClick={() => setQuery('')}
                      className="absolute right-20 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200"
                    >
                      ✕
                    </button>
                  )}
                </div>
                <button
                  type="submit"
                  className="ml-3 px-6 py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl shadow-md transition-all flex items-center gap-2"
                >
                  <span>Search</span>
                </button>
              </form>

              {/* Controls Bar */}
              <div className="flex flex-wrap items-center justify-between gap-3 text-sm">
                <div className="flex flex-wrap items-center gap-2">
                  <button
                    type="button"
                    onClick={() => setIsLinear(!isLinear)}
                    className={`px-3 py-1.5 rounded-lg border text-xs font-medium transition-all ${
                      isLinear
                        ? 'bg-amber-500/20 border-amber-500/50 text-amber-300'
                        : 'bg-slate-900 border-slate-700 text-slate-300 hover:border-slate-600'
                    }`}
                  >
                    {isLinear ? '⚠️ Mode: Linear Scan Baseline' : '🚀 Mode: Inverted Index'}
                  </button>

                  {!isLinear && (
                    <>
                      <div className="inline-flex rounded-lg bg-slate-900 p-0.5 border border-slate-800 text-xs">
                        <button
                          type="button"
                          onClick={() => setAlgorithm('bm25')}
                          className={`px-3 py-1 rounded-md font-medium transition-all ${
                            algorithm === 'bm25' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-slate-200'
                          }`}
                        >
                          Okapi BM25
                        </button>
                        <button
                          type="button"
                          onClick={() => setAlgorithm('tfidf')}
                          className={`px-3 py-1 rounded-md font-medium transition-all ${
                            algorithm === 'tfidf' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-slate-200'
                          }`}
                        >
                          TF-IDF
                        </button>
                      </div>

                      {algorithm === 'bm25' && (
                        <button
                          type="button"
                          onClick={() => setShowTuning(!showTuning)}
                          className={`px-2.5 py-1.5 rounded-lg border text-xs flex items-center gap-1.5 transition-all ${
                            showTuning
                              ? 'bg-blue-500/10 border-blue-500/40 text-blue-300'
                              : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-300'
                          }`}
                        >
                          ⚙️ k₁={k1.toFixed(2)} b={b.toFixed(2)}
                        </button>
                      )}
                    </>
                  )}

                  <button
                    type="button"
                    onClick={() => setShowSyntax(!showSyntax)}
                    className="px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs text-slate-400 hover:text-slate-300"
                  >
                    💡 Syntax Help
                  </button>
                </div>

                {latencyMs !== null && (
                  <div className="flex items-center gap-2 text-xs">
                    {fromCache && (
                      <span className="px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                        ⚡ Cached
                      </span>
                    )}
                    <span className="px-2.5 py-1 rounded-lg bg-slate-900 border border-slate-800 text-slate-300 font-mono">
                      <span className="text-blue-400 font-semibold">{latencyMs.toFixed(2)} ms</span> latency
                    </span>
                    <span className="px-2.5 py-1 rounded-lg bg-slate-900 border border-slate-800 text-slate-300">
                      <span className="text-slate-100 font-semibold">{totalHits}</span> results
                    </span>
                  </div>
                )}
              </div>

              {/* BM25 Hyperparameter Tuning */}
              {showTuning && algorithm === 'bm25' && !isLinear && (
                <div className="p-4 bg-slate-900/90 border border-slate-800 rounded-xl space-y-3 text-xs">
                  <div className="flex items-center justify-between text-slate-300 font-medium">
                    <span>BM25 Ranking Parameters</span>
                    <button onClick={() => { setK1(1.2); setB(0.75); }} className="text-blue-400 hover:underline">
                      Reset Defaults (k₁=1.2, b=0.75)
                    </button>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <div className="flex justify-between text-slate-400 mb-1">
                        <span>Term Frequency Saturation (k₁): <strong>{k1.toFixed(2)}</strong></span>
                      </div>
                      <input
                        type="range" min="0.1" max="3.0" step="0.05" value={k1}
                        onChange={(e) => setK1(parseFloat(e.target.value))}
                        className="w-full accent-blue-500"
                      />
                    </div>
                    <div>
                      <div className="flex justify-between text-slate-400 mb-1">
                        <span>Document Length Normalization (b): <strong>{b.toFixed(2)}</strong></span>
                      </div>
                      <input
                        type="range" min="0.0" max="1.0" step="0.05" value={b}
                        onChange={(e) => setB(parseFloat(e.target.value))}
                        className="w-full accent-blue-500"
                      />
                    </div>
                  </div>
                </div>
              )}

              {/* Syntax Guide */}
              {showSyntax && (
                <div className="p-4 bg-slate-900 border border-slate-800 rounded-xl space-y-2 text-xs">
                  <div className="flex justify-between items-center text-slate-300 font-semibold">
                    <span>Query Syntax Guide</span>
                    <button onClick={() => setShowSyntax(false)} className="text-slate-400 hover:text-slate-200">✕</button>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    <div className="p-2 bg-slate-950 rounded border border-slate-800 cursor-pointer" onClick={() => { setQuery('"public tender"'); handleSearch('"public tender"'); setShowSyntax(false); }}>
                      <span className="text-blue-400 font-semibold block">Exact Phrase</span>
                      <code className="text-amber-300">"public tender"</code>
                    </div>
                    <div className="p-2 bg-slate-950 rounded border border-slate-800 cursor-pointer" onClick={() => { setQuery('federal AND procurement'); handleSearch('federal AND procurement'); setShowSyntax(false); }}>
                      <span className="text-emerald-400 font-semibold block">Boolean AND</span>
                      <code className="text-amber-300">federal AND procurement</code>
                    </div>
                    <div className="p-2 bg-slate-950 rounded border border-slate-800 cursor-pointer" onClick={() => { setQuery('notice OR tender'); handleSearch('notice OR tender'); setShowSyntax(false); }}>
                      <span className="text-purple-400 font-semibold block">Boolean OR</span>
                      <code className="text-amber-300">notice OR tender</code>
                    </div>
                  </div>
                </div>
              )}

              {/* Document Type Filter Chips */}
              <div className="flex flex-wrap items-center gap-2 pt-1">
                <span className="text-xs text-slate-400 mr-1">Filter Type:</span>
                {DOC_TYPES.map((t) => (
                  <button
                    key={t.id}
                    onClick={() => setSelectedType(t.id)}
                    className={`px-3 py-1 rounded-full text-xs font-medium transition-all ${
                      selectedType === t.id
                        ? 'bg-blue-600/30 border border-blue-500 text-blue-200'
                        : 'bg-slate-900/60 border border-slate-800 text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    {t.label}
                  </button>
                ))}
              </div>
            </div>

            {/* Results List */}
            <div className="w-full max-w-5xl mx-auto space-y-4">
              {loading ? (
                <div className="py-12 space-y-3">
                  <div className="p-6 bg-slate-900/60 border border-slate-800 rounded-2xl animate-pulse space-y-2">
                    <div className="h-5 bg-slate-800 rounded w-2/5" />
                    <div className="h-4 bg-slate-800/60 rounded w-full" />
                  </div>
                </div>
              ) : hits.length === 0 ? (
                <div className="py-16 text-center space-y-3 bg-slate-900/40 border border-slate-800/80 rounded-2xl p-8">
                  <h3 className="text-lg font-semibold text-slate-200">No documents found</h3>
                  <p className="text-sm text-slate-400">Try searching for "tender", "cybersecurity", or click "+ Ingest" to add documents.</p>
                </div>
              ) : (
                hits.map((hit, idx) => {
                  const style = TYPE_COLORS[hit.doc_type] || { bg: 'bg-slate-800', text: 'text-slate-300', border: 'border-slate-700' };
                  const scorePct = Math.min(100, Math.round((hit.score / maxScore) * 100));

                  return (
                    <article
                      key={hit.doc_id}
                      onClick={() => openDoc(hit.doc_id)}
                      className="p-5 bg-slate-900/80 hover:bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-2xl transition-all shadow cursor-pointer group"
                    >
                      <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="text-xs font-mono text-slate-500">#{idx + 1}</span>
                            <h2 className="text-base sm:text-lg font-semibold text-slate-100 group-hover:text-blue-400 transition-colors">
                              {hit.title}
                            </h2>
                          </div>
                          <div className="flex flex-wrap items-center gap-2 text-xs text-slate-400 mt-1">
                            <span className={`px-2 py-0.5 rounded border text-[10px] uppercase font-medium ${style.bg} ${style.text} ${style.border}`}>
                              {hit.doc_type.replace('_', ' ')}
                            </span>
                            <span>•</span>
                            <span>{hit.source}</span>
                            <span>•</span>
                            <span>{hit.date}</span>
                            {hit.doc_length > 0 && <span>• {hit.doc_length} tokens</span>}
                          </div>
                        </div>

                        <div className="flex sm:flex-col items-center sm:items-end justify-between gap-1 text-right min-w-[90px]">
                          <span className="text-xs font-mono text-slate-400">Score: <strong className="text-blue-400">{hit.score.toFixed(3)}</strong></span>
                          <div className="w-20 bg-slate-800 h-1.5 rounded-full overflow-hidden">
                            <div className="bg-gradient-to-r from-blue-500 to-indigo-500 h-full rounded-full" style={{ width: `${scorePct}%` }} />
                          </div>
                        </div>
                      </div>

                      {hit.snippet && (
                        <div
                          className="mt-3 text-sm text-slate-300 leading-relaxed font-sans"
                          dangerouslySetInnerHTML={{ __html: hit.snippet }}
                        />
                      )}

                      <div className="mt-4 pt-3 border-t border-slate-800/80 flex flex-wrap items-center justify-between gap-2 text-xs">
                        <div className="flex flex-wrap items-center gap-1.5">
                          <span className="text-slate-500 text-[11px]">Matched terms:</span>
                          {(hit.matched_terms || []).map((term, tIdx) => (
                            <span key={tIdx} className="px-2 py-0.5 rounded bg-slate-800 text-blue-300 border border-slate-700 font-mono text-[11px]">
                              {term}
                            </span>
                          ))}
                        </div>
                        <span className="text-blue-400 group-hover:translate-x-0.5 transition-transform text-[11px]">
                          View Document →
                        </span>
                      </div>
                    </article>
                  );
                })
              )}
            </div>
          </main>

          {/* Document Viewer Modal */}
          {selectedDoc && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="relative w-full max-w-4xl max-h-[85vh] bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl flex flex-col overflow-hidden">
                <div className="p-5 border-b border-slate-800 flex items-start justify-between gap-4">
                  <div>
                    <span className="px-2 py-0.5 rounded text-[10px] font-mono uppercase bg-blue-500/20 text-blue-300 border border-blue-500/30">
                      Doc #{selectedDoc.id} • {selectedDoc.doc_type}
                    </span>
                    <h2 className="text-xl font-bold text-slate-100 mt-1">{selectedDoc.title}</h2>
                  </div>
                  <button onClick={() => setSelectedDoc(null)} className="p-1 rounded text-slate-400 hover:text-slate-100">✕</button>
                </div>
                <div className="px-5 py-3 bg-slate-950/50 border-b border-slate-800 flex flex-wrap gap-4 text-xs text-slate-400">
                  <div><strong>Source:</strong> {selectedDoc.source}</div>
                  <div><strong>Date:</strong> {selectedDoc.date}</div>
                  <div><strong>Length:</strong> {selectedDoc.length} tokens</div>
                </div>
                <div className="p-6 overflow-y-auto flex-1 font-mono text-xs leading-relaxed text-slate-200 whitespace-pre-wrap">
                  {selectedDoc.content}
                </div>
                <div className="p-4 border-t border-slate-800 bg-slate-900/90 flex justify-between items-center">
                  <button
                    onClick={() => deleteDoc(selectedDoc.id)}
                    className="px-3.5 py-2 bg-rose-600/10 hover:bg-rose-600/20 text-rose-300 border border-rose-500/30 rounded-xl text-xs font-medium"
                  >
                    Delete Document
                  </button>
                  <button onClick={() => setSelectedDoc(null)} className="px-5 py-2 bg-slate-800 text-slate-200 rounded-xl text-xs font-medium">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Index Stats Modal */}
          {showStatsModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="relative w-full max-w-2xl bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl p-6 space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h2 className="text-lg font-bold text-slate-100">Index Corpus & Engine Stats</h2>
                  <button onClick={() => setShowStatsModal(false)} className="text-slate-400 hover:text-slate-100">✕</button>
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <div className="text-xl font-bold text-blue-400">{stats?.active_documents || 0}</div>
                    <div className="text-xs text-slate-400">Active Docs</div>
                  </div>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <div className="text-xl font-bold text-emerald-400">{stats?.total_unique_terms || 0}</div>
                    <div className="text-xs text-slate-400">Unique Terms</div>
                  </div>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <div className="text-xl font-bold text-purple-400">{stats?.total_postings || 0}</div>
                    <div className="text-xs text-slate-400">Total Postings</div>
                  </div>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <div className="text-xl font-bold text-amber-400">{((stats?.estimated_memory_bytes || 0) / 1024 / 1024).toFixed(2)} MB</div>
                    <div className="text-xs text-slate-400">Memory Size</div>
                  </div>
                </div>
                <div className="flex justify-end pt-2">
                  <button onClick={() => setShowStatsModal(false)} className="px-5 py-2 bg-slate-800 text-slate-200 rounded-xl text-xs font-medium">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Ingestion Modal */}
          {showIngestionModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="relative w-full max-w-xl bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl p-6 space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h2 className="text-lg font-bold text-slate-100">Ingest Documents</h2>
                  <button onClick={() => setShowIngestionModal(false)} className="text-slate-400 hover:text-slate-100">✕</button>
                </div>
                <div className="p-4 bg-blue-900/20 border border-blue-800/40 rounded-xl flex items-center justify-between">
                  <div>
                    <div className="text-xs font-semibold text-blue-200">Load 8 Public Documents</div>
                    <div className="text-[11px] text-slate-400">Import NIST, OMB, FAR, DoD public datasets</div>
                  </div>
                  <button
                    onClick={async () => {
                      await fetch('/api/ingest/sample', { method: 'POST' });
                      fetchStats();
                      handleSearch();
                      setShowIngestionModal(false);
                    }}
                    className="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-medium"
                  >
                    Import Samples
                  </button>
                </div>
                <div className="flex justify-end pt-2">
                  <button onClick={() => setShowIngestionModal(false)} className="px-5 py-2 bg-slate-800 text-slate-200 rounded-xl text-xs font-medium">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Benchmark Modal */}
          {showBenchmarkModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="relative w-full max-w-3xl bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl p-6 space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h2 className="text-lg font-bold text-slate-100">Performance Benchmark Results</h2>
                  <button onClick={() => setShowBenchmarkModal(false)} className="text-slate-400 hover:text-slate-100">✕</button>
                </div>
                <div className="grid grid-cols-3 gap-3 text-center">
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <div className="text-2xl font-bold text-emerald-400">80.6x</div>
                    <div className="text-xs text-slate-400">Speedup vs Linear (1k)</div>
                  </div>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <div className="text-2xl font-bold text-blue-400">1.15 ms</div>
                    <div className="text-xs text-slate-400">BM25 Mean Latency</div>
                  </div>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <div className="text-2xl font-bold text-purple-400">2,665</div>
                    <div className="text-xs text-slate-400">Multi-threaded QPS</div>
                  </div>
                </div>
                <div className="flex justify-end pt-2">
                  <button onClick={() => setShowBenchmarkModal(false)} className="px-5 py-2 bg-slate-800 text-slate-200 rounded-xl text-xs font-medium">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
