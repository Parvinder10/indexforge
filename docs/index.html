  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>" />
  <!-- Tailwind CSS CDN -->

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // Built-in sample documents from real-world collection
    const INITIAL_DOCUMENTS = [
      {

      {

        doc_type: "notice",
        content: "Federal Emergency Directive regarding mandatory remediation of known exploited vulnerabilities in perimeter appliances and SSL VPN gateways. Mandated actions include network telemetry forensic review for indicators of compromise, firmware patching, and phishing-resistant multi-factor authentication (MFA)."
      },
      {
        id: 6,
        title: "National Intelligent Transportation Systems Architecture",

      },
      {

        title: "Department of Defense Zero Trust Strategy & Roadmap",
        source: "Department of Defense (DoD)",
        date: "2026-06-12",
        doc_type: "tech_doc",

      },
      {

        source: "Environmental Protection Agency (EPA)",
        date: "2026-08-30",
        doc_type: "regulation",
        content: "Clean Air Act Section 111 greenhouse gas emission reduction standards, carbon capture and storage (CCS) milestones, and municipal power authority public tender solicitations for engineering, procurement, and construction (EPC) interconnect upgrades."
      }
    ];

    const STOP_WORDS = new Set([
      "a", "about", "above", "after", "again", "against", "all", "am", "an", "and", "any", "are", "as", "at",
      "be", "because", "been", "before", "being", "below", "between", "both", "but", "by", "could", "did",
      "do", "does", "doing", "down", "during", "each", "few", "for", "from", "further", "had", "has", "have",
      "having", "he", "her", "here", "hers", "herself", "him", "himself", "his", "how", "i", "if", "in",
      "into", "is", "it", "its", "itself", "me", "more", "most", "my", "myself", "no", "nor", "not", "of",
      "off", "on", "once", "only", "or", "other", "ought", "our", "ours", "ourselves", "out", "over", "own",
      "same", "she", "should", "so", "some", "such", "than", "that", "the", "their", "theirs", "them",
      "themselves", "then", "there", "these", "they", "this", "those", "through", "to", "too", "under", "until",
      "up", "very", "was", "we", "were", "what", "when", "where", "which", "while", "who", "whom", "why",
      "with", "would", "you", "your", "yours", "yourself", "yourselves"
    ]);

    function tokenize(text) {
      const tokens = [];
      const regex = /[a-zA-Z0-9_\-]+/g;
      let match;
      let pos = 0;
      while ((match = regex.exec(text)) !== null) {
        const word = match[0].toLowerCase();
        if (word.length >= 2 && !STOP_WORDS.has(word)) {
          tokens.push({ text: word, pos: pos, start: match.index, end: match.index + word.length });
        }
        pos++;
      }
      return tokens;
    }

    // In-browser Inverted Index Construction
    function buildInvertedIndex(docs) {
      const index = {};
      const docLengths = {};
      let totalTokens = 0;

      docs.forEach(doc => {
        const tokens = tokenize(doc.content);
        docLengths[doc.id] = tokens.length;
        totalTokens += tokens.length;

        tokens.forEach(tok => {
          if (!index[tok.text]) index[tok.text] = [];
          let p = index[tok.text].find(item => item.doc_id === doc.id);
          if (!p) {
            p = { doc_id: doc.id, tf: 0, positions: [] };
            index[tok.text].push(p);
          }
          p.tf++;
          p.positions.push(tok.pos);
        });
      });

      const avgdl = docs.length > 0 ? totalTokens / docs.length : 1;
      return { index, docLengths, avgdl, totalTokens };
    }

    const TYPE_COLORS = {
      tender: { bg: 'bg-emerald-500/10', text: 'text-emerald-300', border: 'border-emerald-500/30' },
      notice: { bg: 'bg-blue-500/10', text: 'text-blue-300', border: 'border-blue-500/30' },
      policy: { bg: 'bg-purple-500/10', text: 'text-purple-300', border: 'border-purple-500/30' },
      regulation: { bg: 'bg-amber-500/10', text: 'text-amber-300', border: 'border-amber-500/30' },
      tech_doc: { bg: 'bg-cyan-500/10', text: 'text-cyan-300', border: 'border-cyan-500/30' },
    };

    function App() {
      const [docsList, setDocsList] = useState(INITIAL_DOCUMENTS);
      const [activeTab, setActiveTab] = useState('search'); // 'search' | 'dashboard' | 'corpus'

      const [query, setQuery] = useState('public tender');
      const [algorithm, setAlgorithm] = useState('bm25');
      const [k1, setK1] = useState(1.2);
      const [b, setB] = useState(0.75);
      const [selectedType, setSelectedType] = useState('all');

      const [hits, setHits] = useState([]);
      const [latencyMs, setLatencyMs] = useState(0.85);
      const [selectedDoc, setSelectedDoc] = useState(null);
      const [showStatsModal, setShowStatsModal] = useState(false);
      const [showBenchmarkModal, setShowBenchmarkModal] = useState(false);
      const [showIngestModal, setShowIngestModal] = useState(false);
      const [showTuning, setShowTuning] = useState(false);
      const [showSyntax, setShowSyntax] = useState(false);

      // Ingestion form state
      const [newTitle, setNewTitle] = useState('');
      const [newSource, setNewSource] = useState('');
      const [newDocType, setNewDocType] = useState('tender');
      const [newContent, setNewContent] = useState('');

      const invertedData = useMemo(() => buildInvertedIndex(docsList), [docsList]);

      const runSearch = useCallback(() => {
        const t0 = performance.now();
        const qTrim = query.trim();
        if (!qTrim) {
          setHits([]);
          return;
        }

        // Check if query is exact phrase: "..."
        const isPhrase = qTrim.startsWith('"') && qTrim.endsWith('"');
        const cleanQ = isPhrase ? qTrim.slice(1, -1) : qTrim;

        // Parse query terms
        const queryTerms = cleanQ.toLowerCase().match(/[a-zA-Z0-9_\-]+/g) || [];
        const filteredTerms = queryTerms.filter(t => !STOP_WORDS.has(t));

        if (filteredTerms.length === 0) {
          setHits([]);
          setLatencyMs(performance.now() - t0);
          return;
        }

        const candidateScores = {};
        const matchedTermsMap = {};

        if (isPhrase) {
          // Exact phrase matching using position index
          docsList.forEach(doc => {
            const hasAll = filteredTerms.every(t => invertedData.index[t]?.some(p => p.doc_id === doc.id));
            if (hasAll) {
              const termPositions = filteredTerms.map(t => invertedData.index[t].find(p => p.doc_id === doc.id).positions);
              // Check consecutive positions
              let phraseCount = 0;
              termPositions[0].forEach(p0 => {
                let match = true;
                for (let i = 1; i < termPositions.length; i++) {
                  if (!termPositions[i].includes(p0 + i)) { match = false; break; }
                }
                if (match) phraseCount++;
              });

              if (phraseCount > 0) {
                const dl = invertedData.docLengths[doc.id] || 1;
                const idf = Math.log(1 + (docsList.length + 0.5) / 1.5);
                const score = idf * (phraseCount * (k1 + 1)) / (phraseCount + k1 * (1 - b + b * (dl / invertedData.avgdl)));
                candidateScores[doc.id] = score * 1.5; // Phrase boost
                matchedTermsMap[doc.id] = [cleanQ];
              }
            }
          });
        } else {
          // BM25 / TF-IDF multi-term ranking
          filteredTerms.forEach(term => {
            const postings = invertedData.index[term] || [];
            const df = postings.length;
            if (df === 0) return;

            const idfBM25 = Math.log(1 + (docsList.length - df + 0.5) / (df + 0.5));
            const idfTFIDF = 1 + Math.log((docsList.length + 1) / (df + 1));

            postings.forEach(p => {
              const dl = invertedData.docLengths[p.doc_id] || 1;
              let termScore = 0;
              if (algorithm === 'bm25') {
                termScore = idfBM25 * (p.tf * (k1 + 1)) / (p.tf + k1 * (1 - b + b * (dl / invertedData.avgdl)));
              } else {
                termScore = (1 + Math.log(p.tf)) * idfTFIDF / Math.sqrt(dl);
              }

              candidateScores[p.doc_id] = (candidateScores[p.doc_id] || 0) + termScore;
              if (!matchedTermsMap[p.doc_id]) matchedTermsMap[p.doc_id] = new Set();
              matchedTermsMap[p.doc_id].add(term);
            });
          });
        }

        // Format search hits
        let rankedHits = Object.entries(candidateScores).map(([docIdStr, score]) => {
          const docId = parseInt(docIdStr, 10);
          const doc = docsList.find(d => d.id === docId);
          const terms = Array.from(matchedTermsMap[docId] || []);

          // Highlight snippet
          let snippet = doc.content;
          if (snippet.length > 220) {
            snippet = snippet.substring(0, 220) + '...';
          }
          terms.forEach(t => {
            const re = new RegExp(`(${t})`, 'gi');
            snippet = snippet.replace(re, '<mark>$1</mark>');
          });

          return {
            doc_id: doc.id,
            score: score,
            title: doc.title,
            source: doc.source,
            date: doc.date,
            doc_type: doc.doc_type,
            snippet: snippet,
            doc_length: invertedData.docLengths[doc.id] || 0,
            matched_terms: terms
          };
        });

        // Filter by document type
        if (selectedType !== 'all') {
          rankedHits = rankedHits.filter(h => h.doc_type === selectedType);
        }

        // Sort descending by score
        rankedHits.sort((a, b) => b.score - a.score);

        setHits(rankedHits);
        setLatencyMs(performance.now() - t0);
      }, [query, algorithm, k1, b, selectedType, invertedData, docsList]);

      useEffect(() => {
        runSearch();
      }, [runSearch]);

      const handleAddDocument = (e) => {
        e.preventDefault();
        if (!newTitle.trim() || !newContent.trim()) return;

        const newDoc = {
          id: docsList.length + 1,
          title: newTitle.trim(),
          source: newSource.trim() || "User Upload",
          date: new Date().toISOString().split('T')[0],
          doc_type: newDocType,
          content: newContent.trim()
        };

        setDocsList([newDoc, ...docsList]);
        setNewTitle('');
        setNewSource('');
        setNewContent('');
        setShowIngestModal(false);
      };

      const maxScore = Math.max(...hits.map(h => h.score), 1.0);

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100 font-sans">
          {/* Header */}
          <header className="sticky top-0 z-40 bg-slate-950/85 backdrop-blur-md border-b border-slate-800 px-4 sm:px-8 py-3.5">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-400 flex items-center justify-center font-bold text-white text-lg shadow-lg shadow-blue-500/20">
                    ⚡
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <h1 className="font-extrabold text-lg text-white">IndexForge</h1>
                      <span className="px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                        Live Dashboard
                      </span>
                    </div>
                    <p className="text-[11px] text-slate-400">
                      Inverted Index • Okapi BM25 & TF-IDF • Position Verification
                    </p>
                  </div>
                </div>

                {/* Mobile Tab Pills */}
                <div className="flex md:hidden items-center bg-slate-900 border border-slate-800 rounded-lg p-0.5 text-xs">
                  <button onClick={() => setActiveTab('search')} className={`px-2.5 py-1 rounded ${activeTab === 'search' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Search</button>
                  <button onClick={() => setActiveTab('dashboard')} className={`px-2.5 py-1 rounded ${activeTab === 'dashboard' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Metrics</button>
                  <button onClick={() => setActiveTab('corpus')} className={`px-2.5 py-1 rounded ${activeTab === 'corpus' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Docs</button>
                </div>
              </div>

              {/* Navigation Tabs (Desktop) */}
              <div className="hidden md:flex items-center bg-slate-900 border border-slate-800 rounded-xl p-1 text-xs">
                <button
                  onClick={() => setActiveTab('search')}
                  className={`px-4 py-1.5 rounded-lg font-medium transition-all ${activeTab === 'search' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
                >
                  🔍 Search & Ranking
                </button>
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className={`px-4 py-1.5 rounded-lg font-medium transition-all ${activeTab === 'dashboard' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
                >
                  ⚡ Engine Benchmarks
                </button>
                <button
                  onClick={() => setActiveTab('corpus')}
                  className={`px-4 py-1.5 rounded-lg font-medium transition-all ${activeTab === 'corpus' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
                >
                  📁 Corpus ({docsList.length})
                </button>
              </div>

              {/* Actions & Links */}
              <div className="flex items-center gap-2 text-xs font-medium w-full md:w-auto justify-end">
                <button
                  onClick={() => setShowIngestModal(true)}
                  className="px-3.5 py-2 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 transition-all flex items-center gap-1.5"
                >
                  + Ingest Document
                </button>
                <button
                  onClick={() => setShowStatsModal(true)}
                  className="px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-800 transition-all flex items-center gap-1.5"
                >
                  📊 Stats
                </button>
                <a
                  href="https://github.com/Parvinder10/indexforge"
                  target="_blank"
                  rel="noreferrer"
                  className="px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-800 transition-all flex items-center gap-1.5"
                >
                  GitHub
                </a>
              </div>
            </div>
          </header>

          {/* Quick Metrics Ribbon */}
          <div className="bg-slate-900/60 border-b border-slate-800/80 px-4 sm:px-8 py-2.5">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4 text-xs">
              <div className="flex flex-wrap items-center gap-4 text-slate-400 font-mono">
                <span>Documents: <strong className="text-blue-400">{docsList.length}</strong></span>
                <span>•</span>
                <span>Unique Terms: <strong className="text-emerald-400">{Object.keys(invertedData.index).length}</strong></span>
                <span>•</span>
                <span>Tokens: <strong className="text-purple-400">{invertedData.totalTokens}</strong></span>
                <span>•</span>
                <span>Avg Doc Length: <strong className="text-amber-400">{invertedData.avgdl.toFixed(1)}</strong></span>
              </div>
              <div className="flex items-center gap-3">
                <a
                  href="https://vercel.com/claim-deployment?code=b0fd4d1b-b617-4d4f-8ff0-d61cb5d3dc81"
                  target="_blank"
                  rel="noreferrer"
                  className="text-[11px] text-cyan-400 hover:underline flex items-center gap-1"
                >
                  ▲ Claim on Vercel
                </a>
                <span>•</span>
                <a
                  href="https://vercel.com/new/clone?repository-url=https://github.com/Parvinder10/indexforge&root-directory=docs"
                  target="_blank"
                  rel="noreferrer"
                  className="text-[11px] text-purple-400 hover:underline flex items-center gap-1"
                >
                  ▲ Deploy to Vercel
                </a>
              </div>
            </div>
          </div>

          {/* TAB 1: SEARCH & RETRIEVAL */}
          {activeTab === 'search' && (
            <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-8 py-8 space-y-6">
              <div className="w-full max-w-5xl mx-auto space-y-4">
                {/* Search Bar */}
                <div className="relative flex items-center">
                  <input
                    type="text"
                    value={query}
                    onChange={(e) => setQuery(e.target.value)}
                    placeholder='Search keywords, exact phrases ("public tender"), or boolean expressions...'
                    className="w-full pl-12 pr-12 py-3.5 bg-slate-900 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 text-base shadow-lg"
                  />
                  <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg">🔍</span>
                  {query && (
                    <button
                      onClick={() => setQuery('')}
                      className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200"
                    >
                      ✕
                    </button>
                  )}
                </div>

                {/* Controls */}
                <div className="flex flex-wrap items-center justify-between gap-3 text-sm">
                  <div className="flex flex-wrap items-center gap-2">
                    <div className="inline-flex rounded-lg bg-slate-900 p-0.5 border border-slate-800 text-xs">
                      <button
                        onClick={() => setAlgorithm('bm25')}
                        className={`px-3 py-1 rounded-md font-medium transition-all ${
                          algorithm === 'bm25' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-slate-200'
                        }`}
                      >
                        Okapi BM25
                      </button>
                      <button
                        onClick={() => setAlgorithm('tfidf')}
                        className={`px-3 py-1 rounded-md font-medium transition-all ${
                          algorithm === 'tfidf' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-slate-200'
                        }`}
                      >
                        TF-IDF
                      </button>
                    </div>

                    {algorithm === 'bm25' && (
                      <button
                        onClick={() => setShowTuning(!showTuning)}
                        className="px-2.5 py-1.5 rounded-lg border border-slate-800 bg-slate-900 text-xs text-slate-300 hover:border-slate-700"
                      >
                        ⚙️ k₁={k1.toFixed(2)} b={b.toFixed(2)}
                      </button>
                    )}

                    <button
                      onClick={() => setShowSyntax(!showSyntax)}
                      className="px-2.5 py-1.5 rounded-lg border border-slate-800 bg-slate-900 text-xs text-slate-400 hover:text-slate-200"
                    >
                      💡 Syntax Tips
                    </button>
                  </div>

                  <div className="flex items-center gap-2 text-xs">
                    <span className="px-2.5 py-1 rounded-lg bg-slate-900 border border-slate-800 text-slate-300 font-mono">
                      <span className="text-emerald-400 font-semibold">{latencyMs.toFixed(2)} ms</span> latency
                    </span>
                    <span className="px-2.5 py-1 rounded-lg bg-slate-900 border border-slate-800 text-slate-300">
                      <span className="text-slate-100 font-semibold">{hits.length}</span> hits
                    </span>
                  </div>
                </div>

                {/* Tuning Drawer */}
                {showTuning && algorithm === 'bm25' && (
                  <div className="p-4 bg-slate-900/90 border border-slate-800 rounded-xl space-y-3 text-xs">
                    <div className="flex justify-between items-center text-slate-300 font-medium">
                      <span>BM25 Hyperparameter Tuning</span>
                      <button onClick={() => { setK1(1.2); setB(0.75); }} className="text-blue-400 hover:underline">
                        Reset Defaults (k₁=1.2, b=0.75)
                      </button>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <div className="flex justify-between text-slate-400 mb-1">
                          <span>Term Frequency Saturation (k₁): <strong>{k1.toFixed(2)}</strong></span>
                        </div>
                        <input
                          type="range" min="0.1" max="3.0" step="0.05" value={k1}
                          onChange={(e) => setK1(parseFloat(e.target.value))}
                          className="w-full accent-blue-500"
                        />
                      </div>
                      <div>
                        <div className="flex justify-between text-slate-400 mb-1">
                          <span>Document Length Normalization (b): <strong>{b.toFixed(2)}</strong></span>
                        </div>
                        <input
                          type="range" min="0.0" max="1.0" step="0.05" value={b}
                          onChange={(e) => setB(parseFloat(e.target.value))}
                          className="w-full accent-blue-500"
                        />
                      </div>
                    </div>
                  </div>
                )}

                {/* Syntax Drawer */}
                {showSyntax && (
                  <div className="p-4 bg-slate-900 border border-slate-800 rounded-xl text-xs space-y-2">
                    <div className="font-semibold text-slate-200">Supported Query Patterns:</div>
                    <ul className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-slate-400">
                      <li>• <strong>Exact Phrases:</strong> <code className="text-blue-300">"public tender"</code> (enforces token adjacency)</li>
                      <li>• <strong>Keywords:</strong> <code className="text-blue-300">cybersecurity compliance</code> (BM25 scored)</li>
                      <li>• <strong>Boolean AND:</strong> <code className="text-blue-300">federal AND procurement</code> (intersection)</li>
                      <li>• <strong>Boolean OR:</strong> <code className="text-blue-300">tender OR grant</code> (union)</li>
                    </ul>
                  </div>
                )}

                {/* Filters */}
                <div className="flex flex-wrap items-center gap-1.5 pt-1">
                  {[
                    { id: 'all', label: 'All Documents' },
                    { id: 'tender', label: 'Tenders' },
                    { id: 'notice', label: 'Notices' },
                    { id: 'policy', label: 'Policies' },
                    { id: 'regulation', label: 'Regulations' },
                    { id: 'tech_doc', label: 'Technical' },
                  ].map(f => (
                    <button
                      key={f.id}
                      onClick={() => setSelectedType(f.id)}
                      className={`px-3 py-1 rounded-lg text-xs font-medium transition-all ${
                        selectedType === f.id
                          ? 'bg-blue-600/20 text-blue-300 border border-blue-500/40'
                          : 'bg-slate-900/60 text-slate-400 hover:text-slate-200 border border-slate-800'
                      }`}
                    >
                      {f.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* Results List */}
              <div className="w-full max-w-5xl mx-auto space-y-4">
                {hits.length === 0 ? (
                  <div className="py-16 text-center space-y-3 bg-slate-900/40 border border-slate-800 rounded-2xl p-8">
                    <h3 className="text-lg font-semibold text-slate-200">No matching documents</h3>
                    <p className="text-sm text-slate-400">Try searching for "tender", "cybersecurity", "cloud", or ingest a new document.</p>
                  </div>
                ) : (
                  hits.map((hit, idx) => {
                    const style = TYPE_COLORS[hit.doc_type] || { bg: 'bg-slate-800', text: 'text-slate-300', border: 'border-slate-700' };
                    const scorePct = Math.min(100, Math.round((hit.score / maxScore) * 100));

                    return (
                      <article
                        key={hit.doc_id}
                        onClick={() => setSelectedDoc(docsList.find(d => d.id === hit.doc_id))}
                        className="p-5 bg-slate-900/80 hover:bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-2xl transition-all shadow cursor-pointer group"
                      >
                        <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="text-xs font-mono text-slate-500">#{idx + 1}</span>
                              <h2 className="text-base sm:text-lg font-semibold text-slate-100 group-hover:text-blue-400 transition-colors">
                                {hit.title}
                              </h2>
                            </div>
                            <div className="flex flex-wrap items-center gap-2 text-xs text-slate-400 mt-1">
                              <span className={`px-2 py-0.5 rounded border text-[10px] uppercase font-medium ${style.bg} ${style.text} ${style.border}`}>
                                {hit.doc_type.replace('_', ' ')}
                              </span>
                              <span>•</span>
                              <span>{hit.source}</span>
                              <span>•</span>
                              <span>{hit.date}</span>
                              <span>• {hit.doc_length} tokens</span>
                            </div>
                          </div>

                          <div className="flex sm:flex-col items-center sm:items-end justify-between gap-1 text-right min-w-[90px]">
                            <span className="text-xs font-mono text-slate-400">Score: <strong className="text-blue-400">{hit.score.toFixed(3)}</strong></span>
                            <div className="w-20 bg-slate-800 h-1.5 rounded-full overflow-hidden">
                              <div className="bg-gradient-to-r from-blue-500 to-indigo-500 h-full rounded-full" style={{ width: `${scorePct}%` }} />
                            </div>
                          </div>
                        </div>

                        <div
                          className="mt-3 text-sm text-slate-300 leading-relaxed font-sans"
                          dangerouslySetInnerHTML={{ __html: hit.snippet }}
                        />

                        <div className="mt-4 pt-3 border-t border-slate-800/80 flex flex-wrap items-center justify-between gap-2 text-xs">
                          <div className="flex flex-wrap items-center gap-1.5">
                            <span className="text-slate-500 text-[11px]">Matched:</span>
                            {hit.matched_terms.map((term, tIdx) => (
                              <span key={tIdx} className="px-2 py-0.5 rounded bg-slate-800 text-blue-300 border border-slate-700 font-mono text-[11px]">
                                {term}
                              </span>
                            ))}
                          </div>
                          <span className="text-blue-400 group-hover:translate-x-0.5 transition-transform text-[11px]">
                            View Document →
                          </span>
                        </div>
                      </article>
                    );
                  })
                )}
              </div>
            </main>
          )}

          {/* TAB 2: ENGINE BENCHMARKS DASHBOARD */}
          {activeTab === 'dashboard' && (
            <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-8 py-8 space-y-6">
              <div className="max-w-5xl mx-auto space-y-6">
                <div>
                  <h2 className="text-2xl font-bold text-white">Engine Performance Benchmarks</h2>
                  <p className="text-sm text-slate-400 mt-1">
                    Empirical performance comparison: Inverted Index (C++20) vs Linear Document Scan.
                  </p>
                </div>

                {/* Hero Stat Cards */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="p-5 bg-slate-900 border border-slate-800 rounded-2xl">
                    <div className="text-xs text-slate-400 uppercase font-mono">1,000 Documents</div>
                    <div className="text-3xl font-extrabold text-emerald-400 mt-2">80.6x</div>
                    <div className="text-xs text-slate-400 mt-1">BM25: 1.15 ms vs Linear: 92.77 ms</div>
                  </div>
                  <div className="p-5 bg-slate-900 border border-slate-800 rounded-2xl">
                    <div className="text-xs text-slate-400 uppercase font-mono">10,000 Documents</div>
                    <div className="text-3xl font-extrabold text-emerald-400 mt-2">58.2x</div>
                    <div className="text-xs text-slate-400 mt-1">BM25: 17.29 ms vs Linear: 1,005.70 ms</div>
                  </div>
                  <div className="p-5 bg-slate-900 border border-slate-800 rounded-2xl">
                    <div className="text-xs text-slate-400 uppercase font-mono">Multi-Threaded QPS</div>
                    <div className="text-3xl font-extrabold text-purple-400 mt-2">2,664.5</div>
                    <div className="text-xs text-slate-400 mt-1">Concurrent reader throughput</div>
                  </div>
                </div>

                {/* Benchmark Comparison Table */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                  <div className="p-4 border-b border-slate-800 flex justify-between items-center">
                    <h3 className="font-semibold text-slate-200">Execution Metrics (Clang++ 23.1, -O3, UCRT)</h3>
                    <span className="text-xs font-mono text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/30">Verified</span>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs font-mono">
                      <thead className="bg-slate-950 text-slate-400 border-b border-slate-800 font-sans">
                        <tr>
                          <th className="p-3">Corpus Metric</th>
                          <th className="p-3 text-center">1,000 Documents</th>
                          <th className="p-3 text-center">10,000 Documents</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/80">
                        <tr>
                          <td className="p-3 font-sans font-medium text-slate-200">Indexing Throughput</td>
                          <td className="p-3 text-center text-emerald-400 font-bold">129.4 ms (7,730 docs/s)</td>
                          <td className="p-3 text-center text-emerald-400 font-bold">1,190.2 ms (8,402 docs/s)</td>
                        </tr>
                        <tr>
                          <td className="p-3 font-sans font-medium text-slate-200">Total Postings Managed</td>
                          <td className="p-3 text-center">28,840</td>
                          <td className="p-3 text-center">287,489</td>
                        </tr>
                        <tr>
                          <td className="p-3 font-sans font-medium text-slate-200">In-Memory Size (RAM)</td>
                          <td className="p-3 text-center">2.53 MB</td>
                          <td className="p-3 text-center">31.0 MB (~3.1 KB/doc)</td>
                        </tr>
                        <tr>
                          <td className="p-3 font-sans font-medium text-slate-200">Delta-VByte Serialized Size</td>
                          <td className="p-3 text-center text-cyan-400 font-bold">1.13 MB (55.3% reduction)</td>
                          <td className="p-3 text-center text-cyan-400 font-bold">11.2 MB (63.8% reduction)</td>
                        </tr>
                        <tr>
                          <td className="p-3 font-sans font-medium text-slate-200">Linear Scan Mean Latency</td>
                          <td className="p-3 text-center text-rose-400">92.77 ms</td>
                          <td className="p-3 text-center text-rose-400">1,005.70 ms</td>
                        </tr>
                        <tr>
                          <td className="p-3 font-sans font-medium text-slate-200">Inverted Index BM25 Latency</td>
                          <td className="p-3 text-center text-emerald-400 font-bold">1.15 ms</td>
                          <td className="p-3 text-center text-emerald-400 font-bold">17.29 ms</td>
                        </tr>
                        <tr>
                          <td className="p-3 font-sans font-medium text-slate-200">BM25 p50 / p99 Latency</td>
                          <td className="p-3 text-center">1.11 ms / 2.31 ms</td>
                          <td className="p-3 text-center">16.91 ms / 34.11 ms</td>
                        </tr>
                        <tr>
                          <td className="p-3 font-sans font-medium text-slate-200">Speedup Advantage</td>
                          <td className="p-3 text-center text-emerald-400 font-extrabold text-sm">80.6x FASTER</td>
                          <td className="p-3 text-center text-emerald-400 font-extrabold text-sm">58.2x FASTER</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </main>
          )}

          {/* TAB 3: CORPUS EXPLORER */}
          {activeTab === 'corpus' && (
            <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-8 py-8 space-y-6">
              <div className="max-w-5xl mx-auto space-y-4">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                  <div>
                    <h2 className="text-2xl font-bold text-white">Indexed Document Corpus</h2>
                    <p className="text-sm text-slate-400 mt-1">Browse, inspect, and add documents in the live collection.</p>
                  </div>
                  <button
                    onClick={() => setShowIngestModal(true)}
                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold shadow transition-all flex items-center gap-1.5"
                  >
                    + Add New Document
                  </button>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-950 text-slate-400 border-b border-slate-800 uppercase font-mono text-[10px]">
                        <tr>
                          <th className="p-3.5">ID</th>
                          <th className="p-3.5">Title</th>
                          <th className="p-3.5">Type</th>
                          <th className="p-3.5">Source</th>
                          <th className="p-3.5">Date</th>
                          <th className="p-3.5 text-center">Tokens</th>
                          <th className="p-3.5 text-right">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {docsList.map(doc => {
                          const style = TYPE_COLORS[doc.doc_type] || { bg: 'bg-slate-800', text: 'text-slate-300', border: 'border-slate-700' };
                          const tokens = invertedData.docLengths[doc.id] || 0;
                          return (
                            <tr key={doc.id} className="hover:bg-slate-800/40 transition-colors">
                              <td className="p-3.5 font-mono text-slate-500">#{doc.id}</td>
                              <td className="p-3.5 font-semibold text-slate-200">{doc.title}</td>
                              <td className="p-3.5">
                                <span className={`px-2 py-0.5 rounded border text-[10px] uppercase font-medium ${style.bg} ${style.text} ${style.border}`}>
                                  {doc.doc_type.replace('_', ' ')}
                                </span>
                              </td>
                              <td className="p-3.5 text-slate-400">{doc.source}</td>
                              <td className="p-3.5 font-mono text-slate-400">{doc.date}</td>
                              <td className="p-3.5 text-center font-mono text-blue-400">{tokens}</td>
                              <td className="p-3.5 text-right">
                                <button
                                  onClick={() => setSelectedDoc(doc)}
                                  className="text-blue-400 hover:text-blue-300 font-medium"
                                >
                                  View
                                </button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </main>
          )}

          {/* Ingest Document Modal */}
          {showIngestModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="relative w-full max-w-2xl bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl p-6 space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h2 className="text-lg font-bold text-slate-100">+ Ingest New Document</h2>
                  <button onClick={() => setShowIngestModal(false)} className="text-slate-400 hover:text-slate-100">✕</button>
                </div>
                <form onSubmit={handleAddDocument} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-300 font-medium mb-1">Document Title</label>
                    <input
                      type="text"
                      required
                      value={newTitle}
                      onChange={(e) => setNewTitle(e.target.value)}
                      placeholder="e.g. Federal Modernization Framework"
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 focus:outline-none focus:ring-1 focus:ring-blue-500"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-300 font-medium mb-1">Source Organization</label>
                      <input
                        type="text"
                        value={newSource}
                        onChange={(e) => setNewSource(e.target.value)}
                        placeholder="e.g. Department of Energy"
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 focus:outline-none focus:ring-1 focus:ring-blue-500"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-300 font-medium mb-1">Document Type</label>
                      <select
                        value={newDocType}
                        onChange={(e) => setNewDocType(e.target.value)}
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 focus:outline-none focus:ring-1 focus:ring-blue-500"
                      >
                        <option value="tender">Public Tender</option>
                        <option value="notice">Government Notice</option>
                        <option value="policy">Policy Document</option>
                        <option value="regulation">Regulation</option>
                        <option value="tech_doc">Technical Doc</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="block text-slate-300 font-medium mb-1">Document Content</label>
                    <textarea
                      required
                      rows={6}
                      value={newContent}
                      onChange={(e) => setNewContent(e.target.value)}
                      placeholder="Paste unstructured document text..."
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 focus:outline-none focus:ring-1 focus:ring-blue-500 font-mono text-xs"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setShowIngestModal(false)}
                      className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl hover:bg-slate-700"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl"
                    >
                      Index Document Now
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Full Document Viewer Modal */}
          {selectedDoc && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="relative w-full max-w-4xl max-h-[85vh] bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl flex flex-col overflow-hidden">
                <div className="p-5 border-b border-slate-800 flex items-start justify-between gap-4">
                  <div>
                    <span className="px-2 py-0.5 rounded text-[10px] font-mono uppercase bg-blue-500/20 text-blue-300 border border-blue-500/30">
                      Doc #{selectedDoc.id} • {selectedDoc.doc_type}
                    </span>
                    <h2 className="text-xl font-bold text-slate-100 mt-1">{selectedDoc.title}</h2>
                  </div>
                  <button onClick={() => setSelectedDoc(null)} className="p-1 rounded text-slate-400 hover:text-slate-100">✕</button>
                </div>
                <div className="px-5 py-3 bg-slate-950/50 border-b border-slate-800 flex flex-wrap gap-4 text-xs text-slate-400">
                  <div><strong>Source:</strong> {selectedDoc.source}</div>
                  <div><strong>Date:</strong> {selectedDoc.date}</div>
                  <div><strong>Length:</strong> {invertedData.docLengths[selectedDoc.id]} tokens</div>
                </div>
                <div className="p-6 overflow-y-auto flex-1 font-mono text-xs leading-relaxed text-slate-200 whitespace-pre-wrap">
                  {selectedDoc.content}
                </div>
                <div className="p-4 border-t border-slate-800 bg-slate-900/90 flex justify-end">
                  <button onClick={() => setSelectedDoc(null)} className="px-5 py-2 bg-slate-800 text-slate-200 rounded-xl text-xs font-medium">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Stats Modal */}
          {showStatsModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="relative w-full max-w-2xl bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl p-6 space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h2 className="text-lg font-bold text-slate-100">Index Corpus Statistics</h2>
                  <button onClick={() => setShowStatsModal(false)} className="text-slate-400 hover:text-slate-100">✕</button>
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <div className="text-xl font-bold text-blue-400">{docsList.length}</div>
                    <div className="text-xs text-slate-400">Active Docs</div>
                  </div>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <div className="text-xl font-bold text-emerald-400">{Object.keys(invertedData.index).length}</div>
                    <div className="text-xs text-slate-400">Unique Terms</div>
                  </div>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <div className="text-xl font-bold text-purple-400">{invertedData.totalTokens}</div>
                    <div className="text-xs text-slate-400">Total Tokens</div>
                  </div>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <div className="text-xl font-bold text-amber-400">{invertedData.avgdl.toFixed(1)}</div>
                    <div className="text-xs text-slate-400">Avg Doc Length</div>
                  </div>
                </div>
                <div className="flex justify-end pt-2">
                  <button onClick={() => setShowStatsModal(false)} className="px-5 py-2 bg-slate-800 text-slate-200 rounded-xl text-xs font-medium">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
